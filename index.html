<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Can you...? | Word order challenge (printable)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #2c2a2a;
            font-family: 'Georgia', 'Times New Roman', Times, serif;
            padding: 20px;
        }

        .frame {
            background-image: url('Photos/Screenshot_20260407_005538_Pinterest.jpg');
            background-size: 33% auto;
            background-repeat: repeat;
            background-color: #fef3da;
            border-radius: 48px;
            padding: 1.5rem;
            box-shadow: 0 20px 35px rgba(0,0,0,0.4);
            max-width: 1300px;
            margin: 0 auto;
        }

        .worksheet-container {
            background: rgba(250, 245, 235, 0.94);
            border-radius: 32px;
            padding: 1.5rem;
            box-shadow: inset 0 0 0 1px rgba(255,245,200,0.6), 0 10px 20px rgba(0,0,0,0.2);
        }

        .hero-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .nav-btn {
            background: #3d5a3d;
            border: none;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-family: inherit;
        }
        .nav-btn:hover { background: #2c482c; }
        .hero-counter {
            font-size: 1.2rem;
            background: #eeddbb;
            padding: 6px 16px;
            border-radius: 40px;
        }

        .hero-card {
            background: #fffef7;
            border-radius: 48px;
            padding: 1.2rem;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.1);
            border: 1px solid #e2cfaa;
        }
        .hero-img {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #c9aa6f;
            background: #f3e9ce;
            margin-bottom: 10px;
        }
        .hero-name {
            font-size: 2rem;
            font-weight: bold;
            color: #2b4f2b;
        }

        .game-area { margin: 20px 0; }
        .section-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin: 15px 0 8px;
            color: #3d5a3d;
            border-left: 5px solid #b8860b;
            padding-left: 12px;
        }
        .words-bank {
            background: #fdf8ed;
            border-radius: 32px;
            padding: 18px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            border: 1px dashed #c9aa6f;
            min-height: 100px;
        }
        .word-chip {
            background: #eeddbb;
            padding: 10px 18px;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.05s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            user-select: none;
            font-family: monospace;
        }
        .word-chip:hover { background: #e2cfaa; transform: scale(1.02); }
        .sentence-area {
            background: #fdf8ed;
            border-radius: 32px;
            padding: 18px;
            min-height: 100px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            border: 2px solid #b8860b;
        }
        .sentence-word {
            background: #c9e0c9;
            padding: 10px 18px;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 25px 0 20px;
            flex-wrap: wrap;
        }
        .green-btn {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1.2rem;
            border-radius: 60px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 8px #4caf50;
        }
        .green-btn:hover { background: #1b5e20; box-shadow: 0 0 12px #81c784; }
        .reset-btn {
            background: #b86b2c;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1.2rem;
            border-radius: 60px;
            cursor: pointer;
        }
        .print-btn {
            background: #2c6e9e;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1.2rem;
            border-radius: 60px;
            cursor: pointer;
        }
        .print-btn:hover { background: #1e4f6e; }

        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .overlay.active { visibility: visible; opacity: 1; }
        .hint-card {
            background: #fffef7;
            border-radius: 48px;
            padding: 1.5rem;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 35px black;
            border: 2px solid gold;
        }
        .hint-card .hero-img { width: 100px; height: 100px; }
        .correct-sentence {
            font-size: 1.3rem;
            background: #e8f0e8;
            padding: 15px;
            border-radius: 32px;
            margin: 15px 0;
            font-family: monospace;
        }
        .close-hint {
            background: #3d5a3d;
            color: white;
            padding: 8px 20px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
        }
        .error-flash {
            background-color: #ffaaaa !important;
            box-shadow: 0 0 0 2px red;
            transition: 0.05s;
        }

        /* ----------------- Стили для печати ----------------- */
        @media print {
            /* Скрываем все элементы управления, которые не нужны на бумаге */
            .nav-btn,
            .hero-nav,
            .action-buttons,
            .print-btn,
            .overlay,
            .reset-btn,
            .green-btn {
                display: none !important;
            }

            /* Фон и настройки страницы */
            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .frame {
                background-image: url('Photos/Screenshot_20260407_005538_Pinterest.jpg') !important;
                background-size: 33% auto !important;
                background-repeat: repeat !important;
                background-color: #fef3da !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                box-shadow: none !important;
                border-radius: 0 !important;
                padding: 1rem !important;
                max-width: 100% !important;
                margin: 0 !important;
            }

            .worksheet-container {
                background: rgba(250, 245, 235, 0.94) !important;
                box-shadow: none !important;
                padding: 1rem !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            /* Запрещаем разрыв карточек при печати */
            .hero-card,
            .words-bank,
            .sentence-area,
            .section-title {
                break-inside: avoid !important;
                page-break-inside: avoid !important;
            }

            /* Улучшаем читаемость на бумаге */
            .hero-name {
                font-size: 2.2rem !important;
                color: #1e3a1e !important;
            }

            .word-chip,
            .sentence-word {
                font-size: 1rem !important;
                padding: 8px 14px !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .section-title {
                color: #2d452d !important;
                border-left-color: #8b6914 !important;
            }

            /* Убираем тени и лишние рамки для чистоты */
            .hero-card,
            .words-bank,
            .sentence-area {
                box-shadow: none !important;
                border: 1px solid #aaa !important;
            }

            /* Обеспечиваем, чтобы страница использовала всю ширину */
            @page {
                margin: 1.5cm;
                size: A4 portrait;
            }
        }

        @media (max-width: 700px) {
            .word-chip, .sentence-word { font-size: 0.9rem; padding: 6px 12px; }
            .hero-name { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
<div class="frame">
    <div class="worksheet-container">
        <div class="hero-nav">
            <button class="nav-btn" id="prevHeroBtn">◀ PREV</button>
            <span class="hero-counter" id="heroCounter">Task 1 / 28</span>
            <button class="nav-btn" id="nextHeroBtn">NEXT ▶</button>
        </div>

        <div class="hero-card" id="heroCard">
            <img class="hero-img" id="heroImg" alt="hero">
            <div class="hero-name" id="heroName">Thor</div>
        </div>

        <div class="game-area">
            <div class="section-title">📦 Words in disorder (click to build)</div>
            <div class="words-bank" id="wordsBank"></div>
            <div class="section-title">✏️ Your sentence</div>
            <div class="sentence-area" id="sentenceArea"></div>
        </div>

        <div class="action-buttons">
            <button class="green-btn" id="hintBtn">💡 SHOW ANSWER</button>
            <button class="reset-btn" id="resetGameBtn">⟳ TRY AGAIN</button>
            <button class="print-btn" id="printBtn">🖨️ Распечатать / Сохранить как PDF</button>
        </div>
    </div>
</div>

<div id="hintOverlay" class="overlay">
    <div class="hint-card">
        <img id="hintImg" class="hero-img" alt="hero">
        <div class="hero-name" id="hintName"></div>
        <div class="correct-sentence" id="correctSentence"></div>
        <button class="close-hint" id="closeHintBtn">OK, continue</button>
    </div>
</div>

<script>
    // ---------- ОСНОВНЫЕ ДАННЫЕ (правильные последовательности слов) ----------
    const baseTasks = [
        { name: "Thor", img: "Photos/Screenshot_20260410_124319_Pinterest.png",
          correctOrder: ["Can","you","charge","my","phone","just","by","holding","it","for","a","second?"],

        { name: "Thor", img: "Photos/Screenshot_20260410_124319_Pinterest.png",
          correctOrder: ["Can","you","heat","up","a","cup","of","cold","milk","with","your","lightning","powers?"],
          correctFull: "Can you heat up a cup of cold milk with your lightning powers? ⚡🥛" },
        { name: "Spider-Man", img: "Photos/Screenshot_20260404_141131_Pinterest.png",
          correctOrder: ["Can","you","make","a","giant","spider-web","swing","in","my","bedroom?"],
          correctFull: "Can you make a giant spider-web swing in my bedroom?🕸️🛏️" },
        { name: "Spider-Man", img: "Photos/Screenshot_20260404_141131_Pinterest.png",
          correctOrder: ["Can","you","use","your","webs","to","make","a","big","trampoline","for","us","to","jump","on?"],
          correctFull: "Can you use your webs to make a big trampoline for us to jump on?🕸️🤸‍♂️" },
        { name: "Hulk", img: "Photos/Screenshot_20260404_141201_Pinterest.png",
          correctOrder: ["Can","you","draw","a","tiny","picture","with","a","very","small","pencil?"],
          correctFull: "Can you draw a tiny picture with a very small pencil?✏️🎨🔍" },
        { name: "Hulk", img: "Photos/Screenshot_20260404_141201_Pinterest.png",
          correctOrder: ["Can","you","hold","something","delicate","without","crushing","it?"],
          correctFull: "Can you hold something delicate without crushing it?🤲🌷" },
        { name: "Iron Man", img: "Photos/Screenshot_20260404_141223_Pinterest.png",
          correctOrder: ["Can","you","turn","my","room","into","a","laser","tag","arena","with","your","repulsor","blasts?"],
          correctFull: "Can you turn my room into a laser tag arena with your repulsor blasts? 🔫🏟️" },
        { name: "Iron Man", img: "Photos/Screenshot_20260404_141223_Pinterest.png",
          correctOrder: ["Can","you","make","my","bedroom","zero","gravity","with","your","arc","reactor?"],
          correctFull: "Can you make my bedroom zero gravity with your arc reactor?⚛️🚀" },
        { name: "Black Panther", img: "Photos/Screenshot_20260404_141301_Pinterest.png",
          correctOrder: ["Can","you","turn","invisible","and","scare","my","cat","at","home?"],
          correctFull: "Can you turn invisible and scare my cat at home?👻🐈" },
        { name: "Black Panther", img: "Photos/Screenshot_20260404_141301_Pinterest.png",
          correctOrder: ["Can","you","cut","a","pizza","into","perfect","slices","with","your","sharp","claws?"],
          correctFull: "Can you cut a pizza into perfect slices with your sharp claws?🍕" },
        { name: "Ant-Man", img: "Photos/Screenshot_20260404_141326_Pinterest.png",
          correctOrder: ["Can","you","get","very","small","and","drive","my","toy","car","around","the","house?"],
          correctFull: "Can you get very small and drive my toy car around the house?🚗🫨🏠" },
        { name: "Ant-Man", img: "Photos/Screenshot_20260404_141326_Pinterest.png",
          correctOrder: ["Can","you","shrink","and","whisper","the","correct","answers","to","me","during","my","math","test?"],
          correctFull: "Can you shrink and whisper the correct answers to me during my math test? 🤏✨" },
        { name: "Evil Minion", img: "Photos/Screenshot_20260404_141413_Pinterest.png",
          correctOrder: ["Can","you","sing","the","Banana","Song","all","day","long?"],
          correctFull: "Can you sing the \"Banana Song\" all day long?🍌🎵" },
        { name: "Evil Minion", img: "Photos/Screenshot_20260404_141413_Pinterest.png",
          correctOrder: ["Can","you","hide","inside","my","backpack","and","scare","my","friends?"],
          correctFull: "Can you hide inside my backpack and scare my friends?🎒👻" },
        { name: "Harry Potter", img: "Photos/Screenshot_20260404_141439_Pinterest.png",
          correctOrder: ["Can","you","turn","my","pencil","into","a","wand?"],
          correctFull: "Can you turn my pencil into a wand?✏️🪄" },
        { name: "Harry Potter", img: "Photos/Screenshot_20260404_141439_Pinterest.png",
          correctOrder: ["Can","you","help","me","make","my","day","better","with","a","little","magic?"],
          correctFull: "Can you help me make my day better with a little magic?✨😊" },
        { name: "Dobby", img: "Photos/Screenshot_20260404_141504_Pinterest.png",
          correctOrder: ["Can","you","turn","my","maths","textbook","into","a","funny","comic","book?"],
          correctFull: "Can you turn my maths textbook into a funny comic book?📚😂" },
        { name: "Dobby", img: "Photos/Screenshot_20260404_141504_Pinterest.png",
          correctOrder: ["Can","you","make","all","the","pencils","in","the","classroom","dance?"],
          correctFull: "Can you make all the pencils in the classroom dance?✏️💃" },
        { name: "Doctor Strange", img: "Photos/Screenshot_20260404_141639_Pinterest.png",
          correctOrder: ["Can","you","create","a","giant","fluffy","cloud","in","my","bedroom?"],
          correctFull: "Can you create a giant fluffy cloud in my bedroom? ☁️🛏️" },
        { name: "Doctor Strange", img: "Photos/Screenshot_20260404_141639_Pinterest.png",
          correctOrder: ["Can","you","open","a","portal","to","the","motorcycle","racing","track","in","my","bedroom?"],
          correctFull: "Can you open a portal to the motorcycle racing track in my bedroom? 🌀🏍️" },
        { name: "Luke Skywalker", img: "Photos/Screenshot_20260404_141801_Pinterest.png",
          correctOrder: ["Can","you","use","the","Force","to","make","my","toys","float","in","the","air?"],
          correctFull: "Can you use the Force to make my toys float in the air?🌌🧸" },
        { name: "Luke Skywalker", img: "Photos/Screenshot_20260404_141801_Pinterest.png",
          correctOrder: ["Can","you","give","me","a","lightsaber","that","sparkles","when","I","swing","it?"],
          correctFull: "Can you give me a lightsaber that sparkles when I swing it?⚔️✨" },
        { name: "Pikachu", img: "Photos/Screenshot_20260404_141826_Pinterest.png",
          correctOrder: ["Can","you","light","up","a","light","bulb","with","your","Thunderbolt?"],
          correctFull: "Can you light up a light bulb with your Thunderbolt?⚡💡" },
        { name: "Pikachu", img: "Photos/Screenshot_20260404_141826_Pinterest.png",
          correctOrder: ["Can","you","use","your","lightning","bolt-shaped","tail","to","draw","a","funny","picture","for","me?"],
          correctFull: "Can you use your lightning bolt-shaped tail to draw a funny picture for me? ⚡🖊️😂" },
        { name: "Superman", img: "Photos/Screenshot_20260404_141855_Pinterest.png",
          correctOrder: ["Can","you","make","a","giant","mountain","of","popcorn","with","your","heat","vision?"],
          correctFull: "Can you make a giant mountain of popcorn with your heat vision?🍿🏔️" },
        { name: "Superman", img: "Photos/Screenshot_20260404_141855_Pinterest.png",
          correctOrder: ["Can","you","inflate","all","the","balloons","for","a","birthday","party","with","your","super","breath?"],
          correctFull: "Can you inflate all the balloons for a birthday party with your super breath?🎈💨🎉" },
        { name: "Elsa", img: "Photos/Screenshot_20260404_142009_Pinterest.png",
          correctOrder: ["Can","you","make","a","tiny","snowflake","that","never","melts,","so","I","can","keep","it","in","my","pocket","forever?"],
          correctFull: "Can you make a tiny snowflake that never melts, so I can keep it in my pocket forever? ❄️🫧🧥" },
        { name: "Elsa", img: "Photos/Screenshot_20260404_142009_Pinterest.png",
          correctOrder: ["Can","you","use","your","ice","powers","to","keep","my","ice","cream","from","melting","on","a","sunny","day?"],
          correctFull: "Can you use your ice powers to keep my ice cream from melting on a sunny day? 🍦☀️" }
    ];

    // Функция перемешивания
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // Создаём массив заданий с перемешанными словами (для каждого задания свой порядок)
    const allTasks = baseTasks.map(task => ({
        ...task,
        shuffledWords: shuffleArray([...task.correctOrder])
    }));

    let currentIndex = 0;
    let currentTask = null;
    let availableWords = [];
    let builtWords = [];
    let correctSequence = [];

    // DOM элементы
    const heroImg = document.getElementById('heroImg');
    const heroNameSpan = document.getElementById('heroName');
    const wordsBankDiv = document.getElementById('wordsBank');
    const sentenceAreaDiv = document.getElementById('sentenceArea');
    const prevBtn = document.getElementById('prevHeroBtn');
    const nextBtn = document.getElementById('nextHeroBtn');
    const resetBtn = document.getElementById('resetGameBtn');
    const hintBtn = document.getElementById('hintBtn');
    const printBtn = document.getElementById('printBtn');
    const heroCounterSpan = document.getElementById('heroCounter');
    const hintOverlay = document.getElementById('hintOverlay');
    const hintImg = document.getElementById('hintImg');
    const hintNameSpan = document.getElementById('hintName');
    const correctSentenceSpan = document.getElementById('correctSentence');
    const closeHintBtn = document.getElementById('closeHintBtn');

    function loadTask(index) {
        currentTask = allTasks[index];
        heroImg.src = currentTask.img;
        heroImg.onerror = () => { heroImg.src = "https://placehold.co/140x140?text=" + encodeURIComponent(currentTask.name); };
        heroNameSpan.innerText = currentTask.name;
        correctSequence = [...currentTask.correctOrder];
        availableWords = [...currentTask.shuffledWords];
        builtWords = [];
        renderGame();
        heroCounterSpan.innerText = `Task ${index+1} / ${allTasks.length}`;
    }

    function renderGame() {
        wordsBankDiv.innerHTML = '';
        availableWords.forEach(word => {
            const chip = document.createElement('div');
            chip.className = 'word-chip';
            chip.textContent = word;
            chip.addEventListener('click', () => onWordClick(word));
            wordsBankDiv.appendChild(chip);
        });
        sentenceAreaDiv.innerHTML = '';
        builtWords.forEach(word => {
            const placed = document.createElement('div');
            placed.className = 'sentence-word';
            placed.textContent = word;
            sentenceAreaDiv.appendChild(placed);
        });
        sentenceAreaDiv.style.borderColor = (builtWords.length === correctSequence.length && builtWords.length > 0) ? "#4caf50" : "#b8860b";
    }

    function onWordClick(clickedWord) {
        const nextExpected = correctSequence[builtWords.length];
        if (!nextExpected) return;
        if (clickedWord === nextExpected) {
            const idx = availableWords.indexOf(clickedWord);
            if (idx !== -1) availableWords.splice(idx, 1);
            builtWords.push(clickedWord);
            renderGame();
        } else {
            const chips = document.querySelectorAll('.word-chip');
            for (let chip of chips) {
                if (chip.textContent === clickedWord) {
                    chip.classList.add('error-flash');
                    setTimeout(() => chip.classList.remove('error-flash'), 500);
                    break;
                }
            }
        }
    }

    function resetCurrent() {
        availableWords = shuffleArray([...currentTask.correctOrder]);
        builtWords = [];
        renderGame();
    }

    function showHint() {
        hintImg.src = currentTask.img;
        hintImg.onerror = () => { hintImg.src = "https://placehold.co/100x100?text=" + encodeURIComponent(currentTask.name); };
        hintNameSpan.innerText = currentTask.name;
        correctSentenceSpan.innerText = currentTask.correctFull;
        hintOverlay.classList.add('active');
    }

    function closeHint() { hintOverlay.classList.remove('active'); }

    function nextTask() {
        if (currentIndex + 1 < allTasks.length) {
            currentIndex++;
            loadTask(currentIndex);
        } else alert("You've completed all tasks! Great job!");
    }

    function prevTask() {
        if (currentIndex - 1 >= 0) {
            currentIndex--;
            loadTask(currentIndex);
        } else alert("This is the first task.");
    }

    // Печать текущей карточки через стандартный диалог браузера
    function printCurrentCard() {
        window.print();
    }

    function init() {
        loadTask(0);
        prevBtn.addEventListener('click', prevTask);
        nextBtn.addEventListener('click', nextTask);
        resetBtn.addEventListener('click', resetCurrent);
        hintBtn.addEventListener('click', showHint);
        closeHintBtn.addEventListener('click', closeHint);
        printBtn.addEventListener('click', printCurrentCard);
        hintOverlay.addEventListener('click', (e) => { if (e.target === hintOverlay) closeHint(); });
    }
    init();
</script>
