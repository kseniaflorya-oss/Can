<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Heroic Abilities Worksheet | Exact PDF Capture</title>
    <!-- html2pdf bundle -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* КЛАССИЧЕСКИЙ ШРИФТ */
        body, .worksheet-container, .hero-card, .question-item, .download-btn, footer {
            font-family: 'Georgia', 'Times New Roman', Times, serif;
        }

        body {
            background: #2c2a2a;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* РАМКА-ФОН: уменьшен в 3 раза (33% от оригинала), повторяется */
        .frame {
            background-image: url('Photos/Screenshot_20260407_005538_Pinterest.jpg');
            background-size: 33% auto;
            background-repeat: repeat;
            background-position: top left;
            background-color: #fef3da;
            padding: 2rem 1.5rem;
            border-radius: 36px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.4);
            width: fit-content;
            min-width: 100%;
        }

        /* Внутренний контейнер с фиксированной шириной для точного соответствия */
        .worksheet-container {
            max-width: 1300px;
            margin: 0 auto;
            background-color: rgba(250, 245, 235, 0.94);
            border-radius: 28px;
            padding: 1.5rem 1.2rem;
            box-shadow: inset 0 0 0 1px rgba(255,245,200,0.6), 0 10px 20px rgba(0,0,0,0.2);
        }

        .main-title {
            text-align: center;
            font-size: 2.4rem;
            font-weight: 700;
            margin-bottom: 1.8rem;
            color: #2c2418;
            background: #eeddbb;
            display: inline-block;
            width: auto;
            padding: 0.4rem 2rem;
            border-radius: 60px;
            box-shadow: 0 5px 12px rgba(0,0,0,0.2);
            font-family: 'Georgia', 'Times New Roman', serif;
            border: 1px solid #c9aa6f;
        }

        /* Сетка карточек (такая же, как на экране) */
        .hero-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 28px;
            margin-top: 20px;
        }

        .hero-card {
            background: #fffef7;
            border-radius: 32px;
            padding: 1.2rem 1rem 1.5rem;
            text-align: center;
            box-shadow: 0 12px 20px rgba(0,0,0,0.2);
            border: 1px solid #e2cfaa;
        }

        .hero-img {
            width: 160px;
            height: 160px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #c9aa6f;
            box-shadow: 0 5px 12px rgba(0,0,0,0.3);
            background: #f3e9ce;
            margin-bottom: 15px;
        }

        .hero-name {
            font-size: 1.9rem;
            font-weight: 700;
            margin: 10px 0 12px;
            color: #2b4f2b;
            font-family: 'Georgia', 'Times New Roman', serif;
            border-bottom: 2px solid #e2cfaa;
            display: inline-block;
            padding-bottom: 4px;
        }

        .question-item {
            background: #fdf8ed;
            border-radius: 28px;
            padding: 12px;
            margin: 14px 6px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #2c2b26;
            line-height: 1.45;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05), 0 2px 6px rgba(0,0,0,0.1);
            border-left: 6px solid #b8860b;
        }

        .download-btn {
            display: block;
            margin: 45px auto 25px;
            background: #3d5a3d;
            border: none;
            padding: 14px 32px;
            font-size: 1.4rem;
            font-weight: bold;
            font-family: 'Georgia', 'Times New Roman', serif;
            color: #fff3e0;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(0,0,0,0.3);
            transition: 0.1s;
        }

        .download-btn:hover {
            background: #2c482c;
            transform: scale(1.02);
        }

        @media (max-width: 700px) {
            .hero-img { width: 130px; height: 130px; }
            .hero-name { font-size: 1.6rem; }
            .question-item { font-size: 1rem; }
        }

        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.8rem;
            color: #5c4b2a;
            background: #e9ddbc;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            padding: 6px 20px;
            border-radius: 40px;
            font-style: italic;
        }
    </style>
</head>
<body>
<div class="frame">
    <div class="worksheet-container">
        <div style="display: flex; justify-content: center;">
            <h1 class="main-title">⚡ CAN YOU...? ⚡<br> HEROIC ABILITIES WORKSHEET</h1>
        </div>
        <div class="hero-grid" id="heroCardsGrid"></div>
        <div style="display: flex; justify-content: center;">
            <button class="download-btn" id="pdfDownloadBtn">📥 SAVE EXACT PDF (AS ON SCREEN) 📄</button>
        </div>
        <footer>✨ Classic style — exact PDF capture, no page breaks, full background ✨</footer>
    </div>
</div>

<script>
    // Данные героев (Thor с новым фото)
    const heroesData = [
        { name: "Thor", imgSrc: "Photos/Screenshot_20260408_004618_Pinterest.png", questions: ["⚡📱 Can you charge my phone just by holding it for a second?", "⚡🥛 Can you heat up a cup of cold milk with your lightning powers?"] },
        { name: "Spider-Man", imgSrc: "Photos/Screenshot_20260404_141131_Pinterest.png", questions: ["🕸️🛏️ Can you make a giant spider-web swing in my bedroom?", "🕸️🤸‍♂️ Can you use your webs to make a big trampoline for us to jump on?"] },
        { name: "Hulk", imgSrc: "Photos/Screenshot_20260404_141201_Pinterest.png", questions: ["✏️🎨🔍 Can you draw a tiny picture with a very small pencil?", "🤲🌷 Can you hold something delicate without crushing it?"] },
        { name: "Iron Man", imgSrc: "Photos/Screenshot_20260404_141223_Pinterest.png", questions: ["🔫🏟️ Can you turn my room into a laser tag arena with your repulsor blasts?", "⚛️🚀 Can you make my bedroom zero gravity with your arc reactor?"] },
        { name: "Black Panther", imgSrc: "Photos/Screenshot_20260404_141301_Pinterest.png", questions: ["👻🐈 Can you turn invisible and scare my cat at home?", "🍕 Can you cut a pizza into perfect slices with your sharp claws?"] },
        { name: "Ant-Man", imgSrc: "Photos/Screenshot_20260404_141326_Pinterest.png", questions: ["🚗🫨🏠 Can you get very small and drive my toy car around the house?", "🤏✨ Can you shrink and whisper the correct answers to me during my math test?"] },
        { name: "Evil Minion", imgSrc: "Photos/Screenshot_20260404_141413_Pinterest.png", questions: ["🍌🎵 Can you sing the \"Banana Song\" all day long?", "🎒👻 Can you hide inside my backpack and scare my friends?"] },
        { name: "Harry Potter", imgSrc: "Photos/Screenshot_20260404_141439_Pinterest.png", questions: ["✏️🪄 Can you turn my pencil into a wand?", "✨😊 Can you help me make my day better with a little magic?"] },
        { name: "Dobby", imgSrc: "Photos/Screenshot_20260404_141504_Pinterest.png", questions: ["📚😂 Can you turn my maths textbook into a funny comic book?", "✏️💃 Can you make all the pencils in the classroom dance?"] },
        { name: "Doctor Strange", imgSrc: "Photos/Screenshot_20260404_141639_Pinterest.png", questions: ["☁️🛏️ Can you create a giant fluffy cloud in my bedroom?", "🌀🏍️ Can you open a portal to the motorcycle racing track in my bedroom?"] },
        { name: "Luke Skywalker", imgSrc: "Photos/Screenshot_20260404_141801_Pinterest.png", questions: ["🌌🧸 Can you use the Force to make my toys float in the air?", "⚔️✨ Can you give me a lightsaber that sparkles when I swing it?"] },
        { name: "Pikachu", imgSrc: "Photos/Screenshot_20260404_141826_Pinterest.png", questions: ["⚡💡 Can you light up a light bulb with your Thunderbolt?", "⚡🖊️😂 Can you use your lightning bolt-shaped tail to draw a funny picture for me?"] },
        { name: "Superman", imgSrc: "Photos/Screenshot_20260404_141855_Pinterest.png", questions: ["🍿🏔️ Can you make a giant mountain of popcorn with your heat vision?", "🎈💨🎉 Can you inflate all the balloons for a birthday party with your super breath?"] },
        { name: "Elsa", imgSrc: "Photos/Screenshot_20260404_142009_Pinterest.png", questions: ["❄️🫧🧥 Can you make a tiny snowflake that never melts, so I can keep it in my pocket forever?", "🍦☀️ Can you use your ice powers to keep my ice cream from melting on a sunny day?"] }
    ];

    const grid = document.getElementById("heroCardsGrid");
    heroesData.forEach(hero => {
        const card = document.createElement("div");
        card.className = "hero-card";
        const img = document.createElement("img");
        img.className = "hero-img";
        img.src = hero.imgSrc;
        img.alt = hero.name;
        img.onerror = function() { this.src = "https://placehold.co/160x160?text=" + encodeURIComponent(hero.name) + "&font=georgia"; };
        const name = document.createElement("h2");
        name.className = "hero-name";
        name.textContent = hero.name;
        const q1 = document.createElement("div");
        q1.className = "question-item";
        q1.textContent = hero.questions[0];
        const q2 = document.createElement("div");
        q2.className = "question-item";
        q2.textContent = hero.questions[1];
        card.append(img, name, q1, q2);
        grid.appendChild(card);
    });

    // Функция предзагрузки всех изображений (включая фоновое)
    async function preloadAllImages() {
        const images = document.querySelectorAll('img');
        const frame = document.querySelector('.frame');
        let bgUrl = null;
        if (frame) {
            const bg = window.getComputedStyle(frame).backgroundImage;
            const match = bg.match(/url\(["']?(.*?)["']?\)/);
            if (match) bgUrl = match[1];
        }
        const load = (src) => new Promise(resolve => { if(!src) return resolve(); const i = new Image(); i.onload = i.onerror = resolve; i.src = src; });
        const promises = [...images].map(i => load(i.src));
        if (bgUrl) promises.push(load(bgUrl));
        await Promise.all(promises);
    }

    const downloadBtn = document.getElementById("pdfDownloadBtn");
    downloadBtn.addEventListener("click", async () => {
        downloadBtn.disabled = true;
        const originalText = downloadBtn.innerText;
        downloadBtn.innerText = "⏳ Generating exact PDF...";
        try {
            await preloadAllImages();
            const element = document.querySelector('.frame');
            // Ключевые настройки: без разрывов страниц, максимальная точность
            const opt = {
                margin:        [0, 0, 0, 0],
                filename:     'Hero_Worksheet_Exact.pdf',
                image:        { type: 'jpeg', quality: 1 },
                html2canvas:  { scale: 3, useCORS: true, letterRendering: true, backgroundColor: null },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak:    { mode: 'none' }   // <- ГЛАВНОЕ: НЕТ РАЗРЫВОВ, PDF = ОДНА ДЛИННАЯ СТРАНИЦА
            };
            await html2pdf().set(opt).from(element).save();
        } catch (err) {
            console.error(err);
            alert("PDF generation failed, but you can press Ctrl+P and choose 'Save as PDF' for exact copy.");
        } finally {
            downloadBtn.disabled = false;
            downloadBtn.innerText = originalText;
        }
    });

    // Предзагрузка при старте
    window.addEventListener('load', () => preloadAllImages());
</script>
</body>
</html>
