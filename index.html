<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #2c2a2a;
            font-family: 'Georgia', 'Times New Roman', Times, serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Фон-рамочка (уменьшен в 3 раза) */
        .frame {
            background-image: url('Photos/Screenshot_20260407_005538_Pinterest.jpg');
            background-size: 33% auto;
            background-repeat: repeat;
            background-color: #fef3da;
            border-radius: 48px;
            padding: 1.5rem;
            box-shadow: 0 20px 35px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 1400px;
        }

        .worksheet-container {
            background: rgba(250, 245, 235, 0.94);
            border-radius: 32px;
            padding: 1.5rem;
            box-shadow: inset 0 0 0 1px rgba(255,245,200,0.6), 0 10px 20px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            font-size: 2.2rem;
            background: #eeddbb;
            display: inline-block;
            width: auto;
            padding: 0.3rem 1.8rem;
            border-radius: 60px;
            margin-bottom: 1.5rem;
            font-family: inherit;
            color: #2c2418;
        }

        /* Главная сетка: колесо слева, карточка справа (адаптивно) */
        .game-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: center;
            align-items: center;
            margin-top: 1rem;
        }

        .wheel-area {
            flex: 1;
            min-width: 300px;
            text-align: center;
        }

        canvas {
            background: #fff9ef;
            border-radius: 50%;
            box-shadow: 0 20px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            height: auto;
            aspect-ratio: 1 / 1;
            display: block;
            margin: 0 auto;
            transition: all 0.2s;
        }

        /* Кнопка-колесико с картинкой */
        .spin-btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-image: url('Photos/Screenshot_20260407_005538_Pinterest.jpg');
            background-size: cover;
            background-position: center;
            border: 4px solid #ffd966;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(0,0,0,0.5);
            margin: 25px auto 0;
            transition: 0.1s linear;
            display: block;
        }
        .spin-btn:active {
            transform: scale(0.96);
        }
        .spin-btn.disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.3);
        }

        /* Область карточки результата */
        .result-card {
            flex: 1;
            min-width: 280px;
            background: rgba(255,254,247,0.9);
            border-radius: 48px;
            padding: 1.2rem;
            text-align: center;
            box-shadow: 0 12px 24px rgba(0,0,0,0.2);
            border: 1px solid #e2cfaa;
            transition: 0.2s;
        }

        .result-img {
            width: 160px;
            height: 160px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #c9aa6f;
            background: #f3e9ce;
            margin-bottom: 15px;
        }

        .result-name {
            font-size: 2rem;
            font-weight: bold;
            color: #2b4f2b;
            border-bottom: 2px solid #e2cfaa;
            display: inline-block;
            margin-bottom: 12px;
        }

        .result-question {
            background: #fdf8ed;
            border-radius: 28px;
            padding: 12px;
            margin: 12px 6px;
            font-size: 1.1rem;
            font-weight: 600;
            border-left: 6px solid #b8860b;
            text-align: left;
        }

        .reset-btn {
            background: #3d5a3d;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 10px 24px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
            font-family: inherit;
        }

        .message {
            text-align: center;
            font-size: 1.3rem;
            background: #eeddbb;
            padding: 12px;
            border-radius: 40px;
            margin-top: 20px;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            background: #e9ddbc;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 0.8rem;
        }

        @media (max-width: 800px) {
            .result-name { font-size: 1.6rem; }
            .result-question { font-size: 0.95rem; }
            .spin-btn { width: 70px; height: 70px; }
        }
    </style>
</head>
<body>
<div class="frame">
    <div class="worksheet-container">
        <div style="text-align: center;">
  
        </div>

        <div class="game-layout">
            <div class="wheel-area">
                <canvas id="wheelCanvas" width="500" height="500"></canvas>
                <button class="spin-btn" id="spinButton" aria-label="Spin"></button>
            </div>
            <div class="result-card" id="resultCard">
                <div style="padding: 20px; color: #7a5a3a;">✨ Click the wheel button to spin! ✨</div>
            </div>
        </div>
    </div>
</div>

<script>
    // ---------- ДАННЫЕ ГЕРОЕВ (с фото и вопросами) ----------
    const fullHeroesList = [
        { name: "Thor", img: "Photos/Screenshot_20260408_004618_Pinterest.png", q1: "⚡📱 Can you charge my phone just by holding it for a second?", q2: "⚡🥛 Can you heat up a cup of cold milk with your lightning powers?" },
        { name: "Spider-Man", img: "Photos/Screenshot_20260404_141131_Pinterest.png", q1: "🕸️🛏️ Can you make a giant spider-web swing in my bedroom?", q2: "🕸️🤸‍♂️ Can you use your webs to make a big trampoline for us to jump on?" },
        { name: "Hulk", img: "Photos/Screenshot_20260404_141201_Pinterest.png", q1: "✏️🎨🔍 Can you draw a tiny picture with a very small pencil?", q2: "🤲🌷 Can you hold something delicate without crushing it?" },
        { name: "Iron Man", img: "Photos/Screenshot_20260404_141223_Pinterest.png", q1: "🔫🏟️ Can you turn my room into a laser tag arena with your repulsor blasts?", q2: "⚛️🚀 Can you make my bedroom zero gravity with your arc reactor?" },
        { name: "Black Panther", img: "Photos/Screenshot_20260404_141301_Pinterest.png", q1: "👻🐈 Can you turn invisible and scare my cat at home?", q2: "🍕 Can you cut a pizza into perfect slices with your sharp claws?" },
        { name: "Ant-Man", img: "Photos/Screenshot_20260404_141326_Pinterest.png", q1: "🚗🫨🏠 Can you get very small and drive my toy car around the house?", q2: "🤏✨ Can you shrink and whisper the correct answers to me during my math test?" },
        { name: "Evil Minion", img: "Photos/Screenshot_20260404_141413_Pinterest.png", q1: "🍌🎵 Can you sing the \"Banana Song\" all day long?", q2: "🎒👻 Can you hide inside my backpack and scare my friends?" },
        { name: "Harry Potter", img: "Photos/Screenshot_20260404_141439_Pinterest.png", q1: "✏️🪄 Can you turn my pencil into a wand?", q2: "✨😊 Can you help me make my day better with a little magic?" },
        { name: "Dobby", img: "Photos/Screenshot_20260404_141504_Pinterest.png", q1: "📚😂 Can you turn my maths textbook into a funny comic book?", q2: "✏️💃 Can you make all the pencils in the classroom dance?" },
        { name: "Doctor Strange", img: "Photos/Screenshot_20260404_141639_Pinterest.png", q1: "☁️🛏️ Can you create a giant fluffy cloud in my bedroom?", q2: "🌀🏍️ Can you open a portal to the motorcycle racing track in my bedroom?" },
        { name: "Luke Skywalker", img: "Photos/Screenshot_20260404_141801_Pinterest.png", q1: "🌌🧸 Can you use the Force to make my toys float in the air?", q2: "⚔️✨ Can you give me a lightsaber that sparkles when I swing it?" },
        { name: "Pikachu", img: "Photos/Screenshot_20260404_141826_Pinterest.png", q1: "⚡💡 Can you light up a light bulb with your Thunderbolt?", q2: "⚡🖊️😂 Can you use your lightning bolt-shaped tail to draw a funny picture for me?" },
        { name: "Superman", img: "Photos/Screenshot_20260404_141855_Pinterest.png", q1: "🍿🏔️ Can you make a giant mountain of popcorn with your heat vision?", q2: "🎈💨🎉 Can you inflate all the balloons for a birthday party with your super breath?" },
        { name: "Elsa", img: "Photos/Screenshot_20260404_142009_Pinterest.png", q1: "❄️🫧🧥 Can you make a tiny snowflake that never melts, so I can keep it in my pocket forever?", q2: "🍦☀️ Can you use your ice powers to keep my ice cream from melting on a sunny day?" }
    ];

    // Оставшиеся герои (изначально все)
    let remainingHeroes = [...fullHeroesList];

    // Canvas и переменные анимации
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    let currentRotation = 0;      // текущий угол вращения (в радианах)
    let animating = false;
    let animationId = null;
    let spinStartTime = 0;
    let spinDuration = 1800;       // ms
    let targetRotation = 0;
    let selectedHero = null;

    // Цветовая палитра для секторов (яркие, но читаемые)
    const colorPalette = [
        '#FFB3BA', '#C5E99B', '#B5E3FF', '#FFD6A5', '#D4B8D4', '#A0E7E5', '#F9C7C2',
        '#C4E0FA', '#FDE2C4', '#D5AAFF', '#9AD0C2', '#FFC8A2', '#B0D9B1', '#FBC8B5'
    ];

    function getHeroColor(index) {
        return colorPalette[index % colorPalette.length];
    }

    // Отрисовка колеса на основе оставшихся героев и текущего угла поворота
    function drawWheel() {
        const n = remainingHeroes.length;
        if (n === 0) {
            // Если героев нет, рисуем серый круг с сообщением
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.beginPath();
            ctx.arc(canvas.width/2, canvas.height/2, canvas.width/2, 0, Math.PI*2);
            ctx.fillStyle = "#ddd";
            ctx.fill();
            ctx.fillStyle = "#555";
            ctx.font = "bold 20px Georgia";
            ctx.textAlign = "center";
            ctx.fillText("All done!", canvas.width/2, canvas.height/2);
            ctx.restore();
            return;
        }
        
        const angleStep = (Math.PI * 2) / n;
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = canvas.width / 2;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        for (let i = 0; i < n; i++) {
            const startAngle = i * angleStep + currentRotation;
            const endAngle = (i + 1) * angleStep + currentRotation;
            
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, startAngle, endAngle);
            ctx.closePath();
            
            ctx.fillStyle = getHeroColor(i);
            ctx.fill();
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Текст (имя) внутри сектора
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(startAngle + angleStep / 2);
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.font = "bold 14px Georgia";
            ctx.fillStyle = "#2c2a2a";
            const textX = radius * 0.65;
            const textY = 0;
            let name = remainingHeroes[i].name;
            if (name.length > 12) name = name.slice(0,10)+"..";
            ctx.fillText(name, textX, textY);
            ctx.restore();
        }
        
        // Рисуем центральный круг и стрелку
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius * 0.12, 0, Math.PI*2);
        ctx.fillStyle = "#f3c26b";
        ctx.fill();
        ctx.strokeStyle = "#a55d35";
        ctx.lineWidth = 3;
        ctx.stroke();
        
        // Стрелка (треугольник сверху)
        ctx.beginPath();
        ctx.moveTo(centerX - 12, centerY - radius + 8);
        ctx.lineTo(centerX, centerY - radius - 5);
        ctx.lineTo(centerX + 12, centerY - radius + 8);
        ctx.fillStyle = "#c0392b";
        ctx.fill();
    }

    // Анимация вращения
    function animateSpin(now) {
        const elapsed = now - spinStartTime;
        let t = Math.min(1, elapsed / spinDuration);
        // easing cubic out
        const easeOut = 1 - Math.pow(1 - t, 3);
        const currentAngle = targetRotation * easeOut;
        currentRotation = currentAngle;
        drawWheel();
        
        if (t < 1) {
            animationId = requestAnimationFrame(animateSpin);
        } else {
            // Анимация завершена, определяем выпавший сектор
            finishSpin();
        }
    }
    
    function finishSpin() {
        animating = false;
        const n = remainingHeroes.length;
        if (n === 0) {
            // Нет героев, показываем сообщение
            document.getElementById('resultCard').innerHTML = `<div style="padding:20px;text-align:center;">🎉 All heroes have been chosen! 🎉<br><button class="reset-btn" id="resetGameBtn">Start Over 🔄</button></div>`;
            const resetBtn = document.getElementById('resetGameBtn');
            if (resetBtn) resetBtn.addEventListener('click', resetGame);
            return;
        }
        
        // Определяем, какой сектор сейчас "под стрелкой" (стрелка сверху вниз — угол -PI/2)
        // Направление стрелки: вверх (угол -PI/2). Находим сектор, содержащий этот угол с учётом поворота.
        const arrowAngle = -Math.PI / 2; // направление вверх (12 часов)
        let rawAngle = arrowAngle - currentRotation;
        rawAngle = ((rawAngle % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
        const angleStep = (2*Math.PI) / n;
        let selectedIndex = Math.floor(rawAngle / angleStep) % n;
        
        const hero = remainingHeroes[selectedIndex];
        selectedHero = hero;
        
        // Показываем карточку выпавшего героя
        showHeroCard(hero);
        
        // Удаляем героя из массива (убираем из колеса)
        remainingHeroes.splice(selectedIndex, 1);
        
        // Перерисовываем колесо без выпавшего героя, сброс currentRotation на 0 для удобства
        currentRotation = 0;
        drawWheel();
        
        // Если после удаления героев не осталось, активируем кнопку сброса позже
        if (remainingHeroes.length === 0) {
            // через секунду покажем кнопку сброса в карточке
            setTimeout(() => {
                const resultDiv = document.getElementById('resultCard');
                if (resultDiv && !resultDiv.querySelector('#resetGameBtn')) {
                    resultDiv.innerHTML += `<div><button class="reset-btn" id="resetGameBtn">🔄 Play Again 🔄</button></div>`;
                    document.getElementById('resetGameBtn')?.addEventListener('click', resetGame);
                }
            }, 500);
        }
        
        // Разблокируем кнопку вращения
        const spinBtn = document.getElementById('spinButton');
        spinBtn.disabled = false;
        spinBtn.classList.remove('disabled');
    }
    
    function showHeroCard(hero) {
        const resultDiv = document.getElementById('resultCard');
        // создаем карточку с фото и вопросами
        resultDiv.innerHTML = `
            <img class="result-img" src="${hero.img}" alt="${hero.name}" onerror="this.src='https://placehold.co/160x160?text=${encodeURIComponent(hero.name)}&font=georgia'">
            <div class="result-name">${hero.name}</div>
            <div class="result-question">${hero.q1}</div>
            <div class="result-question">${hero.q2}</div>
            <div style="margin-top: 12px; font-style:italic;">✨ This hero leaves the wheel! ✨</div>
        `;
    }
    
    function startSpin() {
        if (animating) return;
        if (remainingHeroes.length === 0) {
            alert("All heroes already spun! Click 'Play Again' to reset.");
            return;
        }
        
        animating = true;
        const spinBtn = document.getElementById('spinButton');
        spinBtn.disabled = true;
        spinBtn.classList.add('disabled');
        
        // Случайный угол поворота: минимум 5 полных оборотов + случайный доворот
        const spins = 5 + Math.random() * 5; // от 5 до 10 оборотов
        const extraAngle = Math.random() * Math.PI * 2;
        targetRotation = currentRotation + spins * 2 * Math.PI + extraAngle;
        spinStartTime = performance.now();
        animationId = requestAnimationFrame(animateSpin);
    }
    
    function resetGame() {
        // Сброс всего: восстанавливаем всех героев, сбрасываем угол, останавливаем анимацию
        if (animating) {
            cancelAnimationFrame(animationId);
            animating = false;
        }
        remainingHeroes = [...fullHeroesList];
        currentRotation = 0;
        drawWheel();
        // Сброс карточки
        document.getElementById('resultCard').innerHTML = `<div style="padding: 20px; color: #7a5a3a;">✨ Click the wheel button to spin! ✨</div>`;
        const spinBtn = document.getElementById('spinButton');
        spinBtn.disabled = false;
        spinBtn.classList.remove('disabled');
    }
    
    // Инициализация: рисуем колесо, назначаем обработчики
    function init() {
        drawWheel();
        const spinBtn = document.getElementById('spinButton');
        spinBtn.addEventListener('click', startSpin);
        // Установка размера canvas адаптивно
        function resizeCanvas() {
            const container = canvas.parentElement;
            const size = Math.min(container.clientWidth, 500);
            canvas.width = size;
            canvas.height = size;
            drawWheel();
        }
        window.addEventListener('resize', () => { resizeCanvas(); });
        resizeCanvas();
    }
    
    init();
</script>
</body>
</html>
